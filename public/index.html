<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>慢邮局 SlowPost | WeVi</title>
<meta name="description" content="把气头上想发的话先寄进慢邮局：开源 AI 帮你改写成冷静版，隔夜再决定发不发。" />
<style>
  :root {
    --ink: #22312a; --paper: #f6f1e7; --card: #fffdf7; --accent: #3e6b4f;
    --accent2: #c98a2d; --muted: #6b7a70; --heat: #c2452d; --line: #e2d9c6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Serif SC", "Songti SC", serif; background: var(--paper); color: var(--ink); }
  header { padding: 42px 20px 10px; text-align: center; }
  header h1 { margin: 0; font-size: 34px; letter-spacing: 4px; }
  header h1 .en { font-size: 15px; letter-spacing: 2px; color: var(--accent2); vertical-align: middle; }
  header p { color: var(--muted); margin: 10px auto 0; max-width: 560px; line-height: 1.7; font-size: 15px; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-top: 22px; box-shadow: 0 2px 10px rgba(60,50,20,.05); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  textarea, input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; font-size: 15px; background: #fff; color: var(--ink); }
  textarea { min-height: 130px; resize: vertical; line-height: 1.7; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font: inherit; font-size: 15px; cursor: pointer; margin-top: 16px; }
  button:disabled { opacity: .55; cursor: wait; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 8px 18px; font-size: 14px; }
  .heat { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 13px; background: #f7e3dc; color: var(--heat); }
  .heat.cool { background: #e0eee2; color: var(--accent); }
  h2 { font-size: 19px; margin: 0 0 6px; }
  h3 { font-size: 15px; margin: 18px 0 6px; color: var(--accent); }
  .rewrite { font-size: 17px; line-height: 1.9; background: #fbf7ec; border-left: 4px solid var(--accent2); padding: 14px 16px; border-radius: 0 10px 10px 0; white-space: pre-wrap; }
  .summary { line-height: 1.8; color: #3c4a42; }
  .needs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .needs { grid-template-columns: 1fr; } }
  .needs ul, .risks { margin: 6px 0 0; padding-left: 20px; line-height: 1.8; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 4px 12px; font-size: 13px; background: #eef5ef; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .letter { border: 1px dashed var(--accent2); border-radius: 12px; padding: 16px; margin-top: 14px; background: #fffaf0; }
  .letter .draft { color: var(--muted); font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
  .err { color: var(--heat); margin-top: 12px; white-space: pre-wrap; }
  .stamp { float: right; border: 2px solid var(--accent2); color: var(--accent2); border-radius: 6px; padding: 4px 10px; transform: rotate(6deg); font-size: 13px; letter-spacing: 2px; }
</style>
</head>
<body>
<header>
  <h1>慢邮局 <span class="en">SLOWPOST · by WeVi</span></h1>
  <p>气头上想发的话，先别发。寄进慢邮局，开源 AI 会把它改写成冷静版、写一份中立摘要，<br/>信先压在这里，隔夜——等你也冷静了，再决定发不发。</p>
</header>
<main>
  <section class="card">
    <h2>✉️ 写一封信</h2>
    <label>背景（可选）：这封信是给谁的、因为什么事</label>
    <input type="text" id="context" placeholder="例如：给室友，因为他总把外卖盒堆在公共桌上" />
    <label>把你现在最想发出去的原话，原样粘进来</label>
    <textarea id="draft" placeholder="例如：你能不能有点公德心？外卖盒堆了三天了，每次都是我收拾，我又不是你妈…"></textarea>
    <button id="send">寄进慢邮局</button>
    <div class="err" id="err"></div>
    <div id="result"></div>
  </section>

  <section class="card">
    <h2>📬 邮局里的信</h2>
    <div class="meta">信件在投递时间之前只显示草稿；时间到了，才能取出冷静版。</div>
    <div id="mailbox"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function fmtTime(ts) { return new Date(ts).toLocaleString("zh-CN", { hour12: false }); }

function renderResult(letter) {
  const p = letter.processed, r = p.result;
  const cards = (p.cards || []).map(c =>
    `<span class="chip" title="${esc(c.card.principle)}">${esc(c.card.title)}</span>`).join("");
  const risks = (r.riskFlags || []).length
    ? `<h3>原稿里的风险点</h3><ul class="risks">${r.riskFlags.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  $("result").innerHTML = `
    <div style="margin-top:22px">
      <span class="stamp">已收存</span>
      <span class="heat">原稿热度 ${p.heatBefore}</span> →
      <span class="heat cool">冷静版热度 ${p.heatAfter}</span>
      <h3>冷静版（隔夜后可取出发送）</h3>
      <div class="rewrite">${esc(r.calmRewrite)}</div>
      <h3>中立摘要</h3>
      <p class="summary">${esc(r.neutralSummary)}</p>
      <div class="needs">
        <div><h3>对方可能的需要</h3><ul>${(r.theirNeeds||[]).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div><h3>你自己的需要</h3><ul>${(r.myNeeds||[]).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>
      ${risks}
      <h3>用到的沟通技巧</h3>
      <div class="chips">${cards}</div>
      <p class="meta">模型：${esc(p.model)} · 投递时间：${fmtTime(letter.releaseAt)} · 在投递前，这封信不会发给任何人。</p>
    </div>`;
}

async function loadMailbox() {
  const res = await fetch("/api/letters");
  const { letters } = await res.json();
  $("mailbox").innerHTML = letters.length ? letters.map(l => `
    <div class="letter">
      <div class="meta">${fmtTime(l.createdAt)} 寄出 · ${l.available ? "可投递" : "投递时间：" + fmtTime(l.releaseAt)}</div>
      <div class="draft">${esc(l.draft)}</div>
      ${l.available
        ? `<button class="ghost" onclick="releaseLetter('${l.id}')">取出冷静版</button> <span id="rel-${l.id}"></span>`
        : `<div class="meta">🔒 冷静版封存中</div>`}
    </div>`).join("") : `<p class="meta">还没有信。</p>`;
}

async function releaseLetter(id) {
  const res = await fetch(`/api/letters/${id}/release`, { method: "POST" });
  const data = await res.json();
  if (!res.ok) { alert(data.error || "还不能取出"); return; }
  const text = data.letter.processed.result.calmRewrite;
  await navigator.clipboard.writeText(text).catch(() => {});
  $("rel-" + id).innerHTML = `<div class="rewrite" style="margin-top:10px">${esc(text)}</div><div class="meta">冷静版已复制到剪贴板。</div>`;
}

$("send").addEventListener("click", async () => {
  const draft = $("draft").value.trim();
  const context = $("context").value.trim();
  $("err").textContent = "";
  if (draft.length < 2) { $("err").textContent = "先把想说的话写下来。"; return; }
  const btn = $("send");
  btn.disabled = true; btn.textContent = "邮局处理中…（检索技巧卡 + 改写，约十几秒）";
  try {
    const res = await fetch("/api/process", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ draft, context }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.error || "处理失败");
    renderResult(data.letter);
    $("draft").value = "";
    loadMailbox();
  } catch (e) {
    $("err").textContent = String(e.message || e);
  } finally {
    btn.disabled = false; btn.textContent = "寄进慢邮局";
  }
});

loadMailbox();
</script>
</body>
</html>
